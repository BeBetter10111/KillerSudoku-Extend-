server:
  port: 8080
  # Render (and other PaaS) terminate TLS at a proxy; trust X-Forwarded-* so same-origin
  # https requests are not mistaken for cross-origin ones (CORS 403 on POST).
  forward-headers-strategy: framework

spring:
  application:
    name: killer-sudoku-backend

app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
    allowed-methods: GET,POST,OPTIONS

game:
  reshape-interval-ms: 0
